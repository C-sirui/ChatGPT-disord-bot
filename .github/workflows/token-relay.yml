name: token-relay

on:
  push:
    paths: ['token-relay/**', '.github/workflows/token-relay.yml']
  pull_request:
    paths: ['token-relay/**', '.github/workflows/token-relay.yml']

defaults:
  run:
    working-directory: token-relay

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U relay" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: token-relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Tests (SQLite)
        run: npm test
      - name: Tests (Postgres)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://relay:relay@localhost:5432/relay_test
